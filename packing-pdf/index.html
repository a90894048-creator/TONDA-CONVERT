<html lang="ko">

<title>통다 DX 인패킹 → PDF 변환기</title>

<style>
  :root{
    --ink:#1c1f26; --paper:#ffffff; --canvas:#f3f4f6; --line:#e2e5ea;
    --accent:#2d4ea6; --accent-ink:#ffffff; --muted:#6b7280; --ok:#1a7f4b; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8e9ec; --paper:#1b1e24; --canvas:#111318; --line:#2b2f38; --accent:#5f86e0; --accent-ink:#0b1020; --muted:#9aa1ad; --ok:#3ddc84; --err:#ff6b6b; }
  }
  :root[data-theme="dark"]{ --ink:#e8e9ec; --paper:#1b1e24; --canvas:#111318; --line:#2b2f38; --accent:#5f86e0; --accent-ink:#0b1020; --muted:#9aa1ad; --ok:#3ddc84; --err:#ff6b6b; }
  :root[data-theme="light"]{ --ink:#1c1f26; --paper:#ffffff; --canvas:#f3f4f6; --line:#e2e5ea; --accent:#2d4ea6; --accent-ink:#ffffff; --muted:#6b7280; --ok:#1a7f4b; --err:#c0392b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Segoe UI',-apple-system,Malgun Gothic,sans-serif;}
  #app{max-width:760px;margin:0 auto;padding:36px 20px 80px;}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.6;}
  #dropzone{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;color:var(--muted);cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s;}
  #dropzone.drag{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--paper));}
  #dropzone .big{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px;}
  #fileList{margin-top:18px;display:flex;flex-direction:column;gap:6px;}
  .frow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;}
  .frow .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .status{font-size:11px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums;}
  .frow .status.ok{color:var(--ok);}
  .frow .status.err{color:var(--err);}
  .frow .rm{cursor:pointer;color:var(--muted);flex-shrink:0;font-size:14px;line-height:1;padding:2px 4px;}
  .frow .rm:hover{color:var(--err);}
  #actions{margin-top:20px;display:flex;gap:10px;align-items:center;}
  button{font-family:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:8px;padding:11px 20px;cursor:pointer;}
  #convertBtn{background:var(--accent);color:var(--accent-ink);}
  #convertBtn:disabled{opacity:.4;cursor:not-allowed;}
  #downloadBtn{background:var(--ok);color:#fff;display:none;}
  #progressWrap{margin-top:16px;display:none;}
  #progressBar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  #progressFill{height:100%;background:var(--accent);width:0%;transition:width .2s;}
  #progressLabel{margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #renderHost{position:fixed;left:-99999px;top:0;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<script>
/* ── TONDA 접근 잠금 (브라우저 닫으면 재입력) ── */
(function(){
  if (location.protocol === 'file:') return;
  let unlocked = sessionStorage.getItem('tonda_gate_ok') === '1';
  const GATE_JSON = 'https://raw.githubusercontent.com/a90894048-creator/TONDA-CONVERT/main/gate.json';
  const GATE_API  = 'https://api.github.com/repos/a90894048-creator/TONDA-CONVERT/contents/gate.json';
  let activeHash = '388ff3adccc5444ba184b8e4edd589fbfc30dc56cada02ecc83004ead7f24aeb';
  const sha256 = async s => { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); };

  /* 열려있는 다른 탭과 인증 상태 공유 — 한 번 입력하면 모든 탭/변환기 통과 (브라우저 닫으면 초기화) */
  let bc = null; try { bc = new BroadcastChannel('tonda_gate'); } catch(_) {}
  let cover = null;
  const removeCover = () => { if (cover) { cover.remove(); cover = null; if (document.body) document.body.style.overflow = ''; } };
  const markUnlocked = broadcast => {
    unlocked = true;
    sessionStorage.setItem('tonda_gate_ok','1');
    removeCover();
    if (broadcast && bc) bc.postMessage({ type:'grant' });
  };
  if (bc) bc.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'ask') { if (unlocked && bc) bc.postMessage({ type:'grant' }); }
    else if (m.type === 'grant') { if (!unlocked) markUnlocked(false); }
  };
  if (unlocked) return;   // 이 탭은 이미 인증됨

  const buildCover = () => {
    if (unlocked) return;
    cover = document.createElement('div');
    cover.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#f4f5f7;display:flex;align-items:center;justify-content:center;font-family:"Malgun Gothic",Arial,sans-serif;';
    cover.innerHTML = '<div style="width:320px;background:#fff;border:1px solid #ececec;border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);">'
      + '<div style="width:54px;height:54px;border-radius:14px;background:#e8f0fe;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;">🔒</div>'
      + '<div style="font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">TONDA 통관 변환기</div>'
      + '<div style="font-size:13px;color:#888;margin-bottom:20px;">접근하려면 비밀번호를 입력하세요</div>'
      + '<input id="_gpw" type="password" placeholder="비밀번호" style="width:100%;padding:10px 12px;border:1px solid #d0d7e3;border-radius:8px;text-align:center;font-size:14px;margin-bottom:10px;box-sizing:border-box;">'
      + '<button id="_gok" style="width:100%;padding:10px;border:none;border-radius:8px;background:#1a1a2e;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">확인</button>'
      + '<div id="_gerr" style="font-size:12px;color:#e74c3c;margin-top:10px;min-height:15px;"></div>'
      + '<div style="font-size:11px;color:#aaa;">브라우저를 닫으면 다시 입력해야 합니다</div>'
      + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0;"><a id="_gchg" href="#" style="font-size:11px;color:#2563eb;text-decoration:none;">🔑 비밀번호 변경</a></div>'
      + '</div>';
    document.documentElement.appendChild(cover);
    if (document.body) document.body.style.overflow = 'hidden';
    const pw = cover.querySelector('#_gpw'), err = cover.querySelector('#_gerr');
    const unlock = async () => {
      if (await sha256(pw.value) === activeHash) { markUnlocked(true); }
      else { err.textContent = '비밀번호가 올바르지 않습니다'; pw.select(); }
    };
    cover.querySelector('#_gok').onclick = unlock;
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
    pw.focus();
    cover.querySelector('#_gchg').onclick = async e => {
      e.preventDefault();
      const cur = prompt('현재 비밀번호'); if (cur == null) return;
      if (await sha256(cur) !== activeHash) { alert('현재 비밀번호가 올바르지 않습니다.'); return; }
      const n1 = prompt('새 비밀번호'); if (!n1) return;
      const n2 = prompt('새 비밀번호 확인'); if (n1 !== n2) { alert('새 비밀번호가 일치하지 않습니다.'); return; }
      let token = localStorage.getItem('tonda_gh_token') || prompt('GitHub 토큰 (변경 권한 필요)');
      if (!token) return; localStorage.setItem('tonda_gh_token', token);
      const nh = await sha256(n1);
      const content = btoa(unescape(encodeURIComponent(JSON.stringify({ hash: nh, updated: new Date().toISOString() }))));
      let sha = null;
      try { const g = await fetch(GATE_API, { headers: { Authorization: 'token ' + token } }); if (g.ok) sha = (await g.json()).sha; } catch(_) {}
      const body = { message: '비밀번호 변경', content }; if (sha) body.sha = sha;
      const put = await fetch(GATE_API, { method: 'PUT', headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (put.ok) { activeHash = nh; alert('비밀번호가 변경되었습니다. 모든 사용자에게 1~2분 내 적용됩니다.'); }
      else { alert('변경 실패: ' + ((await put.json().catch(()=>({}))).message || put.status)); }
    };
  };
  const showGate = () => {
    if (unlocked) return;   // 대기 중 다른 탭에서 인증되면 입력창을 띄우지 않음
    if (document.body) buildCover();
    else document.addEventListener('DOMContentLoaded', buildCover);
  };

  if (bc) bc.postMessage({ type:'ask' });   // 열려있는 다른 탭에 인증 여부 질의
  setTimeout(showGate, 250);                // 응답 없으면 비밀번호 입력창 표시
  fetch(GATE_JSON + '?t=' + Date.now()).then(r => r.ok ? r.json() : null).then(j => { if (j && j.hash) activeHash = j.hash; }).catch(()=>{});
})();
</script>

<div id="app">
  <h1>통다 DX 인패킹 → PDF 변환기</h1>
  <p class="sub">선적서류_운임인보이스 엑셀을 업로드하면 비엘·운임내역서·인보이스·패킹리스트 순으로 4페이지를 묶은 A4 PDF 1개를 파일마다 만들어 ZIP으로 묶어줍니다.</p>

  <div id="dropzone">
    <div class="big">엑셀 파일을 여기로 끌어다 놓거나 클릭해서 선택</div>
    <div>.xlsx 여러 개 한번에 선택 가능</div>
  </div>
  <input type="file" id="fileInput" multiple accept=".xlsx">

  <div id="fileList"></div>

  <div id="actions">
    <button id="convertBtn" disabled>변환 시작</button>
    <button id="downloadBtn">ZIP 다운로드</button>
  </div>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel"></div>
  </div>
</div>

<div id="renderHost"></div>

<script>
/* ========================= XML helpers ========================= */
function children(el, name) {
  const out = [];
  if (!el) return out;
  for (let i = 0; i < el.childNodes.length; i++) {
    const n = el.childNodes[i];
    if (n.nodeType === 1 && n.localName === name) out.push(n);
  }
  return out;
}
function child1(el, name) { return children(el, name)[0] || null; }

/* ========================= sheet parsing ========================= */
function colToNum(colLetters) {
  let n = 0;
  for (let i = 0; i < colLetters.length; i++) n = n * 26 + (colLetters.charCodeAt(i) - 64);
  return n;
}
function splitAddr(addr) {
  const m = addr.match(/^([A-Z]+)(\d+)$/);
  return { col: colToNum(m[1]), row: parseInt(m[2], 10) };
}

function parseSharedStrings(doc) {
  if (!doc) return [];
  const siEls = children(doc.documentElement, 'si');
  return siEls.map(si => {
    let text = '';
    for (let i = 0; i < si.childNodes.length; i++) {
      const n = si.childNodes[i];
      if (n.nodeType === 1 && n.localName === 't') text += n.textContent;
      if (n.nodeType === 1 && n.localName === 'r') {
        const t = child1(n, 't');
        if (t) text += t.textContent;
      }
    }
    return text;
  });
}

function parseSheet(doc, sharedStrings) {
  const root = doc.documentElement;
  const sheetDataEl = child1(root, 'sheetData');
  const rows = {};
  children(sheetDataEl, 'row').forEach(rowEl => {
    const r = parseInt(rowEl.getAttribute('r'), 10);
    const cells = {};
    children(rowEl, 'c').forEach(cEl => {
      const addr = cEl.getAttribute('r');
      const { col } = splitAddr(addr);
      const t = cEl.getAttribute('t');
      let value = '';
      const vEl = child1(cEl, 'v');
      const isEl = child1(cEl, 'is');
      if (t === 's' && vEl) {
        value = sharedStrings[parseInt(vEl.textContent, 10)] || '';
      } else if (t === 'inlineStr' && isEl) {
        const tEl = child1(isEl, 't');
        value = tEl ? tEl.textContent : '';
      } else if (vEl) {
        value = vEl.textContent;
      }
      cells[col] = { value, type: t || 'n' };
    });
    rows[r] = { cells };
  });
  return { rows };
}

function parseDrawing(doc) {
  if (!doc) return [];
  const anchors = children(doc.documentElement, 'twoCellAnchor');
  return anchors.map(a => {
    const from = child1(a, 'from');
    const pic = child1(a, 'pic');
    let rId = null;
    if (pic) {
      const blipFill = child1(pic, 'blipFill');
      const blip = blipFill && child1(blipFill, 'blip');
      if (blip) rId = blip.getAttribute('r:embed') || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'embed');
    }
    const g = (el, name) => { const c = child1(el, name); return c ? parseInt(c.textContent, 10) : 0; };
    return { fromCol: g(from, 'col'), rId };
  });
}

function parseRels(doc) {
  if (!doc) return {};
  const rels = {};
  children(doc.documentElement, 'Relationship').forEach(r => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  return rels;
}

/* ========================= workbook loader ========================= */
const xmlParser = new DOMParser();
function xml(text) { return xmlParser.parseFromString(text, 'application/xml'); }

function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function loadWorkbook(arrayBuffer) {
  const zip = await JSZip.loadAsync(arrayBuffer);
  const wbDoc = xml(await zip.file('xl/workbook.xml').async('string'));
  const sheetsEl = child1(wbDoc.documentElement, 'sheets');
  const sheetDefs = children(sheetsEl, 'sheet').map(s => ({
    name: s.getAttribute('name'),
    rId: s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'),
  }));
  const wbRels = parseRels(xml(await zip.file('xl/_rels/workbook.xml.rels').async('string')));
  let sharedStrings = [];
  if (zip.file('xl/sharedStrings.xml')) {
    sharedStrings = parseSharedStrings(xml(await zip.file('xl/sharedStrings.xml').async('string')));
  }

  async function loadSheetByNameOrIndex(name, index) {
    let def = sheetDefs.find(s => s.name === name);
    if (!def) def = sheetDefs[index];
    if (!def) return null;
    const target = wbRels[def.rId];
    const doc = xml(await zip.file('xl/' + target).async('string'));
    const sheet = parseSheet(doc, sharedStrings);

    const sheetFile = target.split('/').pop();
    const relsPath = `xl/worksheets/_rels/${sheetFile}.rels`;
    let anchors = [];
    let images = {};
    const relsFile = zip.file(relsPath);
    if (relsFile) {
      const rels = parseRels(xml(await relsFile.async('string')));
      const drawingRelId = Object.keys(rels).find(k => rels[k].includes('drawing'));
      if (drawingRelId) {
        const drawingTarget = rels[drawingRelId];
        const drawingPath = 'xl/' + drawingTarget.replace('../', '');
        const drawingFileObj = zip.file(drawingPath);
        if (drawingFileObj) {
          anchors = parseDrawing(xml(await drawingFileObj.async('string')));
          const drawingFile = drawingTarget.split('/').pop();
          const drawingRelsPath = `xl/drawings/_rels/${drawingFile}.rels`;
          const drawingRelsFile = zip.file(drawingRelsPath);
          if (drawingRelsFile) {
            const drawingRels = parseRels(xml(await drawingRelsFile.async('string')));
            for (const rid in drawingRels) {
              const target2 = drawingRels[rid];
              const mediaPath = 'xl/' + target2.replace('../', '');
              const mediaFile = zip.file(mediaPath);
              if (!mediaFile) continue;
              const mediaBuf = await mediaFile.async('arraybuffer');
              const ext = mediaPath.split('.').pop();
              images[rid] = `data:image/${ext};base64,${arrayBufferToBase64(mediaBuf)}`;
            }
          }
        }
      }
    }
    return { sheet, anchors, images };
  }
  return { loadSheetByNameOrIndex };
}

/* ========================= field extraction ========================= */
function cellVal(sheet, addr) {
  const { col, row } = splitAddr(addr);
  const r = sheet.rows[row];
  const c = r && r.cells[col];
  return c ? String(c.value).trim() : '';
}
function cellNum(sheet, addr) {
  const n = parseFloat(cellVal(sheet, addr));
  return isNaN(n) ? 0 : n;
}

function extractBL(sheet) {
  const goods = [];
  let startRow = null;
  for (let r = 26; r <= 42; r++) {
    const desc = cellVal(sheet, `E${r}`);
    if (desc) {
      if (startRow === null) startRow = r;
      goods.push(desc);
    } else if (startRow !== null) {
      break;
    }
  }
  startRow = startRow || 26;
  return {
    consignorName: cellVal(sheet, 'B2'),
    blNo: cellVal(sheet, 'I2'),
    consigneeName: cellVal(sheet, 'B5'),
    consigneeAddr: [cellVal(sheet, 'B6'), cellVal(sheet, 'B7')].filter(Boolean),
    consigneeBizNo: cellVal(sheet, 'B8'),
    notifyParty: cellVal(sheet, 'B10'),
    deliverToName: cellVal(sheet, 'H11'),
    deliverToAddr: [cellVal(sheet, 'H12'), cellVal(sheet, 'H13')].filter(Boolean),
    deliverToTel: cellVal(sheet, 'H14'),
    placeOfReceipt: cellVal(sheet, 'C14'),
    vesselVoyage: cellVal(sheet, 'B16'),
    portOfLoading: cellVal(sheet, 'B18'),
    portOfDischarge: cellVal(sheet, 'C18'),
    containerSealNo: cellVal(sheet, 'B21'),
    ctns: cellVal(sheet, `C${startRow}`),
    goods,
    grossWeight: cellVal(sheet, `I${startRow}`),
    measurement: cellVal(sheet, `L${startRow}`),
    term: cellVal(sheet, 'D44'),
    freightPrepaidCollect: cellVal(sheet, 'E46'),
    shippedOnBoardDate: cellVal(sheet, 'I47'),
    sayLine: cellVal(sheet, 'C48'),
    originalsCount: cellVal(sheet, 'C59'),
  };
}

function extractHeaderBlock(sheet) {
  return {
    shipperName: cellVal(sheet, 'A4'),
    shipperAddr: [cellVal(sheet, 'A5'), cellVal(sheet, 'A6')].filter(Boolean),
    invoiceNo: cellVal(sheet, 'C4'),
    invoiceDate: cellVal(sheet, 'F4'),
    lcNoDate: cellVal(sheet, 'C6'),
    consigneeName: cellVal(sheet, 'A8'),
    consigneeAddr: [cellVal(sheet, 'A9'), cellVal(sheet, 'A10')].filter(Boolean),
    consigneeBizNo: cellVal(sheet, 'A11'),
    lcIssuingBank: cellVal(sheet, 'C8'),
    remark: cellVal(sheet, 'C10'),
    notifyParty: cellVal(sheet, 'A14'),
    portOfLoading: cellVal(sheet, 'A17'),
    finalDestination: cellVal(sheet, 'B17'),
    carrier: cellVal(sheet, 'A19'),
    sailingOnAbout: cellVal(sheet, 'B19'),
  };
}

function extractPacking(sheet) {
  const header = extractHeaderBlock(sheet);
  const items = [];
  let r = 21;
  while (cellVal(sheet, `B${r}`)) {
    items.push({
      desc: cellVal(sheet, `B${r}`), ctns: cellVal(sheet, `C${r}`), qty: cellVal(sheet, `D${r}`),
      unit: cellVal(sheet, `E${r}`), nw: cellVal(sheet, `F${r}`), gw: cellVal(sheet, `G${r}`),
      measurement: cellVal(sheet, `H${r}`),
    });
    r++;
  }
  const totals = {
    ctns: cellVal(sheet, `C${r}`), unit: cellVal(sheet, `E${r}`), nw: cellVal(sheet, `F${r}`),
    gw: cellVal(sheet, `G${r}`), measurement: cellVal(sheet, `H${r}`),
  };
  return { header, items, totals };
}

function extractInvoice(sheet) {
  const header = extractHeaderBlock(sheet);
  const items = [];
  let r = 21;
  while (cellVal(sheet, `J${r}`)) {
    items.push({
      desc: cellVal(sheet, `J${r}`), qty: cellVal(sheet, `K${r}`), unit: cellVal(sheet, `L${r}`),
      unitPrice: cellVal(sheet, `M${r}`), amount: cellVal(sheet, `N${r}`),
    });
    r++;
  }
  const totalAmount = cellVal(sheet, `N${r}`);
  return { header, items, totalAmount };
}

function extractFreight(sheet) {
  const charges = [];
  for (let r = 21; r <= 25; r++) {
    const name = cellVal(sheet, `C${r}`);
    if (!name) continue;
    charges.push({
      name, curr: cellVal(sheet, `G${r}`), unitPrice: cellNum(sheet, `H${r}`),
      fxAmount: cellNum(sheet, `I${r}`), fxRate: cellNum(sheet, `J${r}`), krwAmount: cellNum(sheet, `K${r}`),
    });
  }
  const totalFx = charges.reduce((s, c) => s + c.fxAmount, 0);
  const totalKrw = charges.reduce((s, c) => s + c.krwAmount, 0);
  return {
    companyName: cellVal(sheet, 'C2'), companyAddr: cellVal(sheet, 'C3'), companyTel: cellVal(sheet, 'C4'),
    invoiceNo: cellVal(sheet, 'F8'), blNo: cellVal(sheet, 'F9'), customer: cellVal(sheet, 'F10'),
    outputDate: cellVal(sheet, 'K11'), vesselVoy: cellVal(sheet, 'F14'), pol: cellVal(sheet, 'F15'),
    pod: cellVal(sheet, 'F16'), arrival: cellVal(sheet, 'K16'), weight: cellVal(sheet, 'F17'),
    weightUnit: cellVal(sheet, 'G17'), pkgs: cellVal(sheet, 'K17'), pkgsUnit: cellVal(sheet, 'L17'),
    measurement: cellVal(sheet, 'F18'), measurementUnit: cellVal(sheet, 'G18'), term: cellVal(sheet, 'K18'),
    charges, totalFx, totalKrw, bankInfo: cellVal(sheet, 'C36'),
  };
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function intFmt(s) {
  const n = parseFloat(s);
  if (isNaN(n)) return esc(s);
  return String(n);
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const renderHost = document.getElementById('renderHost');
(function injectSharedDocCss() {
  const style = document.createElement('style');
  style.textContent = SHARED_CSS;
  document.head.appendChild(style);
})();

let files = []; // {file, id}
let outputZipBlob = null;

function renderFileList() {
  fileListEl.innerHTML = '';
  files.forEach(f => {
    const row = document.createElement('div');
    row.className = 'frow';
    row.innerHTML = `<span class="fname">${esc(f.file.name)}</span><span class="status" id="status-${f.id}"></span><span class="rm" data-id="${f.id}">✕</span>`;
    fileListEl.appendChild(row);
  });
  convertBtn.disabled = files.length === 0;
  fileListEl.querySelectorAll('.rm').forEach(el => {
    el.addEventListener('click', () => {
      files = files.filter(f => String(f.id) !== el.dataset.id);
      renderFileList();
    });
  });
}

let idCounter = 0;
function addFiles(fileArray) {
  for (const file of fileArray) {
    if (!/\.xlsx$/i.test(file.name)) continue;
    files.push({ file, id: ++idCounter });
  }
  renderFileList();
  downloadBtn.style.display = 'none';
  outputZipBlob = null;
}

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function baseName(filename) {
  let name = filename.replace(/\.xlsx$/i, '');
  name = name.replace(/^선적서류_운임인보이스_/, '');
  return name;
}

function setStatus(id, text, cls) {
  const el = document.getElementById(`status-${id}`);
  if (el) { el.textContent = text; el.className = 'status' + (cls ? ' ' + cls : ''); }
}

async function renderPageToImage(html) {
  renderHost.innerHTML = html;
  const el = renderHost.querySelector('.doc');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  // JPEG (no alpha channel) avoids a jsPDF bug where canvas PNGs with an alpha
  // channel get embedded as an uncompressed bitmap + soft mask, ballooning file size.
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  renderHost.innerHTML = '';
  return imgData;
}

async function renderCombinedPdfBlob(htmlPages) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  for (let i = 0; i < htmlPages.length; i++) {
    if (i > 0) pdf.addPage();
    const imgData = await renderPageToImage(htmlPages[i]);
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
  }
  return pdf.output('blob');
}

convertBtn.addEventListener('click', async () => {
  convertBtn.disabled = true;
  progressWrap.style.display = 'block';
  downloadBtn.style.display = 'none';
  const zip = new JSZip();
  let done = 0;
  const total = files.length;

  for (const f of files) {
    setStatus(f.id, '처리중...');
    try {
      const buf = await f.file.arrayBuffer();
      const wb = await loadWorkbook(buf);
      const blBundle = await wb.loadSheetByNameOrIndex('비엘', 0);
      const pkBundle = await wb.loadSheetByNameOrIndex('인패킹', 1);
      const frBundle = await wb.loadSheetByNameOrIndex('운임인보이스', 2);
      if (!blBundle || !pkBundle || !frBundle) throw new Error('시트를 찾을 수 없습니다');

      const blData = extractBL(blBundle.sheet);
      const pkData = extractPacking(pkBundle.sheet);
      const ivData = extractInvoice(pkBundle.sheet);
      const frData = extractFreight(frBundle.sheet);

      const blImages = blBundle.anchors
        .slice()
        .sort((a, b) => a.fromCol - b.fromCol)
        .map((a, i) => ({ src: blBundle.images[a.rId], slot: i === 0 ? 'center' : 'right' }))
        .filter(img => img.src);

      const base = baseName(f.file.name);
      const htmlPages = [
        renderBL(blData, blImages),
        renderFreight(frData),
        renderInvoice(ivData),
        renderPacking(pkData),
      ];

      const blob = await renderCombinedPdfBlob(htmlPages);
      zip.file(`${base}.pdf`, blob);
      setStatus(f.id, '완료', 'ok');
    } catch (err) {
      console.error(err);
      setStatus(f.id, '오류: ' + err.message, 'err');
    }
    done++;
    const pct = Math.round((done / total) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${done} / ${total} 완료`;
  }

  outputZipBlob = await zip.generateAsync({ type: 'blob' });
  downloadBtn.style.display = 'inline-block';
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!outputZipBlob) return;
  const url = URL.createObjectURL(outputZipBlob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  a.href = url;
  a.download = `DX_PDF_변환_${today}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
